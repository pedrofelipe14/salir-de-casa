<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>salir de casa</title>
  <meta name="description" content="salir de casa. Diario de un disco en proceso: demos, versiones, arte, fotos e ideas.">
  <link rel="icon" href="assets/banner.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,400;0,800;0,900;1,400&family=IBM+Plex+Mono:wght@400;500&family=Permanent+Marker&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <div class="flash" id="flash" aria-hidden="true"></div>

  <header class="barra">
    <a class="barra-nombre" href="#">salir de casa</a>
    <nav class="barra-nav">
      <a href="#demos">demos</a>
      <a href="#diario">diario</a>
      <a href="#archivo">archivo</a>
      <a href="#instrumento">instrumento</a>
    </nav>
    <span class="barra-hora mono" id="hora">--:--</span>
  </header>

  <section class="hero">
    <canvas class="logo" id="logo" aria-label="Logo de salir de casa: sdc en puntos y una casita dibujada en tiza" role="img"></canvas>
    <h1 class="titulo" data-text="salir de casa">salir de casa</h1>
    <div class="hero-pie mono">
      <span>disco #1 — sin nombre</span>
      <span><span id="progreso"></span>% — <span id="estado"></span></span>
    </div>
  </section>

  <main>
    <section class="bloque" id="demos">
      <h2 class="bloque-titulo"><span class="num">01</span>demos</h2>
      <ol class="tracks" id="demos-list"></ol>
    </section>

    <section class="bloque" id="diario">
      <h2 class="bloque-titulo"><span class="num">02</span>diario</h2>
      <div class="diario" id="diario-list"></div>
    </section>

    <section class="bloque" id="archivo">
      <h2 class="bloque-titulo"><span class="num">03</span>archivo</h2>
      <p class="mono bloque-nota">fotos, arte, bocetos, ideas sueltas. se va llenando.</p>
      <div class="archivo" id="archivo-list"></div>
    </section>

    <section class="bloque" id="instrumento">
      <h2 class="bloque-titulo"><span class="num">04</span>instrumento</h2>
      <div class="instrumento">
        <figure class="captura">
          <img src="assets/plugin.png" alt="Captura del plugin Salir de Casa">
          <figcaption class="mono">salir_de_casa.vst3 — en desarrollo</figcaption>
        </figure>
      </div>
    </section>
  </main>

  <footer class="pie mono">
    <span>salir de casa © <span id="anio"></span></span>
    <span>tocá la pantalla</span>
  </footer>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
