<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>salir de casa</title>
  <meta name="description" content="salir de casa. Diario de un disco en proceso: demos, versiones, letras, visuales, fotos y el instrumento con el que se hace.">
  <link rel="icon" href="assets/banner.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,400;0,800;0,900;1,400&family=IBM+Plex+Mono:wght@400;500&family=Permanent+Marker&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <div class="flash" id="flash" aria-hidden="true"></div>

  <header class="barra">
    <a class="barra-nombre" href="#">salir de casa</a>
    <a class="barra-volver" href="#">&larr; inicio</a>
    <nav class="barra-nav">
      <a href="#/temas">temas</a>
      <a href="#/diario">diario</a>
      <a href="#/archivo">archivo</a>
      <a href="#/instrumento">instrumento</a>
    </nav>
    <span class="barra-hora mono" id="hora">--:--</span>
  </header>

  <!-- Each page (inicio, a song, the instrument) is drawn in here by script.js,
       so the player below keeps playing while you move around. -->
  <div id="vista"></div>

  <footer class="pie mono">
    <span>salir de casa © <span id="anio"></span></span>
    <span class="links" id="links-pie"></span>
  </footer>

  <div class="player" id="player" hidden>
    <button class="player-toggle" id="p-toggle" aria-label="pausar">pause</button>
    <div class="player-info">
      <a class="player-titulo" id="p-titulo" href="#"></a>
      <span class="mono" id="p-version"></span>
    </div>
    <canvas class="player-osc" id="p-osc" width="320" height="48" aria-hidden="true"></canvas>
    <div class="player-barra" id="p-barra" role="slider" aria-label="posición" tabindex="0"><span id="p-fill"></span></div>
    <span class="mono player-tiempo" id="p-tiempo">0:00</span>
    <button class="player-cerrar" id="p-cerrar" aria-label="cerrar reproductor">&times;</button>
  </div>

  <div class="lightbox" id="lightbox" hidden>
    <img id="lb-img" alt="">
    <p class="mono" id="lb-titulo"></p>
  </div>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
